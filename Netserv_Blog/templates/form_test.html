{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    input[type="checkbox"] {
    float: left;
    margin-right: 10px;
    margin-top: 4px;
}
</style>
<main id="main" class="main">
    <div class="pagetitle">
        <h1>Anouncements & Posts</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'home' %}">Home</a></li>
                <li class="breadcrumb-item active">Blog</li>
            </ol>
        </nav>
    </div><!-- End Page Title -->

    <section class="section dashboard">
        <div class="row">
            <div class="col-lg-8">
                <div id="select_form">
                    <form action="#" method="post">{% csrf_token %}
                        {{ form.as_p }}
                        
                        <input type="submit" name="submit" value="Search" />
                    </form>
                </div>
            </div>
        </div>
    </section>
</main>

{% endblock content %}

{% block custom_js %} 

<script>
function getCity() {
    var countryName = document.getElementById("country").value;
    var url = "http://localhost:8000/collections/find_cities?country_name=" + escape(countryName);
    request.open("GET", url, true);
    request.onreadystatechange = updatePage;
    request.send(null);
} 
 
// what to do when http ready state changes
function updatePage() { 
    if (request.readyState == 4) {
        if (request.status == 200) {
  
            // get response array
            var data = JSON.parse(request.responseText); 
            update_select($('select[name=city]'), data);
        }  
        // some error checking
        else if (request.status == 404) {
            alert("Request url does not exist");
        }
        else {
            alert("Error: status code is " + request.status);
        }
    }
}   
 
function update_select(select, data) {
    select.find('option').remove();
    for (var k in data) {
        select.append($('<option value="'+data[k]+'">'+data[k]+'</option>'));
    }
}
</script>
{% endblock custom_js %}
